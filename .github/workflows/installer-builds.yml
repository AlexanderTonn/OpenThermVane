name: Installer Builds

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  QT_VERSION: 6.10.0
  IFW_TOOL_ID: qt.tools.ifw.47
  AQT_BASE_URL: https://download.qt.io

jobs:
  macos:
    name: macOS installer
    runs-on: macos-15
    env:
      QT_HOST: mac
      QT_ARCH: clang_64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt
        shell: bash
        run: |
          set -euo pipefail
          qt_install_dir="${RUNNER_TEMP}/Qt"
          aqt_venv="${RUNNER_TEMP}/aqt-venv"
          python3 -m venv "${aqt_venv}"
          aqt_python="${aqt_venv}/bin/python"
          "${aqt_python}" -m pip install --upgrade pip aqtinstall
          "${aqt_python}" -m aqt install-qt -b "${AQT_BASE_URL}" "${QT_HOST}" desktop "${QT_VERSION}" "${QT_ARCH}" -O "${qt_install_dir}"
          echo "QT_ROOT=${qt_install_dir}/${QT_VERSION}/macos" >> "${GITHUB_ENV}"
          echo "BUILD_DIR=${GITHUB_WORKSPACE}/build/ci-macos-release" >> "${GITHUB_ENV}"

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B "${BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT}" \
            -DTHERMVANE_QT_ROOT="${QT_ROOT}"

      - name: Build installer
        shell: bash
        run: cmake --build "${BUILD_DIR}" --target package_macos_dmg --config Release --parallel

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ThermVaneInstaller-macos
          path: ${{ github.workspace }}/build/ci-macos-release/macos-dmg/ThermVaneInstaller.dmg
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2022
    env:
      QT_HOST: windows
      QT_ARCH: win64_msvc2022_64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt and Qt Installer Framework
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $qtInstallDir = Join-Path $env:RUNNER_TEMP "Qt"
          $aqtVenv = Join-Path $env:RUNNER_TEMP "aqt-venv"
          python -m venv $aqtVenv
          $aqtPython = Join-Path $aqtVenv "Scripts\python.exe"
          & $aqtPython -m pip install --upgrade pip aqtinstall
          & $aqtPython -m aqt install-qt -b $env:AQT_BASE_URL $env:QT_HOST desktop $env:QT_VERSION $env:QT_ARCH -O $qtInstallDir
          & $aqtPython -m aqt install-tool -b $env:AQT_BASE_URL $env:QT_HOST desktop tools_ifw $env:IFW_TOOL_ID -O $qtInstallDir
          $binaryCreator = Get-ChildItem -Path "$qtInstallDir\Tools" -Recurse -Filter binarycreator.exe | Select-Object -First 1
          if (-not $binaryCreator) {
            Write-Error "binarycreator.exe was not installed"
          }
          "BINARYCREATOR=$($binaryCreator.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QT_ROOT=$qtInstallDir\$env:QT_VERSION\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUILD_DIR=$env:GITHUB_WORKSPACE\build\ci-windows-release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install vulkan-sdk --no-progress -y
          $vulkanSdk = Get-ChildItem -Path "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $vulkanSdk) {
            Write-Error "Vulkan SDK was not installed to C:\VulkanSDK"
          }
          "VULKAN_SDK=$($vulkanSdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Vulkan_INCLUDE_DIR=$($vulkanSdk.FullName)\Include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B $env:BUILD_DIR `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT" `
            -DTHERMVANE_QT_ROOT="$env:QT_ROOT" `
            -DTHERMVANE_IFW_BINARYCREATOR="$env:BINARYCREATOR" `
            -DVulkan_INCLUDE_DIR="$env:Vulkan_INCLUDE_DIR"

      - name: Build installer
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --target package_ifw --config Release --parallel

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ThermVaneInstaller-windows
          path: ${{ github.workspace }}/build/ci-windows-release/ifw/ThermVaneInstaller.exe
          if-no-files-found: error

  linux:
    name: Linux installer
    runs-on: ubuntu-24.04
    env:
      QT_HOST: linux
      QT_ARCH: linux_gcc_64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libegl1 \
            libfontconfig1 \
            libfreetype6 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      - name: Install Qt and Qt Installer Framework
        shell: bash
        run: |
          set -euo pipefail
          qt_install_dir="${RUNNER_TEMP}/Qt"
          aqt_venv="${RUNNER_TEMP}/aqt-venv"
          python3 -m venv "${aqt_venv}"
          aqt_python="${aqt_venv}/bin/python"
          "${aqt_python}" -m pip install --upgrade pip aqtinstall
          "${aqt_python}" -m aqt install-qt -b "${AQT_BASE_URL}" "${QT_HOST}" desktop "${QT_VERSION}" "${QT_ARCH}" -O "${qt_install_dir}"
          "${aqt_python}" -m aqt install-tool -b "${AQT_BASE_URL}" "${QT_HOST}" desktop tools_ifw "${IFW_TOOL_ID}" -O "${qt_install_dir}"
          binarycreator="$(find "${qt_install_dir}/Tools" -type f -name binarycreator | head -n 1)"
          if [[ -z "${binarycreator}" ]]; then
            echo "binarycreator was not installed" >&2
            exit 1
          fi
          echo "BINARYCREATOR=${binarycreator}" >> "${GITHUB_ENV}"
          echo "QT_ROOT=${qt_install_dir}/${QT_VERSION}/gcc_64" >> "${GITHUB_ENV}"
          echo "BUILD_DIR=${GITHUB_WORKSPACE}/build/ci-linux-release" >> "${GITHUB_ENV}"

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT}" \
            -DTHERMVANE_QT_ROOT="${QT_ROOT}" \
            -DTHERMVANE_IFW_BINARYCREATOR="${BINARYCREATOR}"

      - name: Build installer
        shell: bash
        run: cmake --build "${BUILD_DIR}" --target package_ifw --config Release --parallel

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ThermVaneInstaller-linux
          path: ${{ github.workspace }}/build/ci-linux-release/ifw/ThermVaneInstaller
          if-no-files-found: error
